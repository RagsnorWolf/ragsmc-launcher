<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RagsMC Launcher</title>
    <style>
      /* ============================================================
         SPLASH SCREEN - Rendered BEFORE React loads.
         This is the FIRST thing the user sees. No white flash.
         ============================================================ */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #0a0e0d;
        color: #e8f0ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      /* --- Splash Screen --- */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0a0e0d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        transition: opacity 0.5s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Animated starfield background */
      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1px 1px at 20% 30%, rgba(34,197,94,0.4), transparent),
          radial-gradient(1px 1px at 40% 70%, rgba(34,197,94,0.2), transparent),
          radial-gradient(1px 1px at 60% 20%, rgba(34,197,94,0.3), transparent),
          radial-gradient(1px 1px at 80% 60%, rgba(34,197,94,0.15), transparent),
          radial-gradient(1px 1px at 10% 80%, rgba(34,197,94,0.25), transparent),
          radial-gradient(1px 1px at 90% 40%, rgba(34,197,94,0.2), transparent),
          radial-gradient(1px 1px at 50% 50%, rgba(34,197,94,0.1), transparent),
          radial-gradient(1.5px 1.5px at 15% 55%, rgba(52,211,153,0.3), transparent),
          radial-gradient(1.5px 1.5px at 75% 35%, rgba(52,211,153,0.2), transparent),
          radial-gradient(1px 1px at 35% 85%, rgba(16,185,129,0.25), transparent),
          radial-gradient(1px 1px at 65% 15%, rgba(16,185,129,0.15), transparent),
          radial-gradient(1px 1px at 85% 75%, rgba(16,185,129,0.2), transparent);
        animation: stars-drift 20s linear infinite;
        opacity: 0.7;
      }
      @keyframes stars-drift {
        0% { transform: translateY(0); }
        100% { transform: translateY(-30px); }
      }

      /* Subtle vignette */
      #splash::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
        pointer-events: none;
      }

      /* Logo icon */
      .splash-logo {
        position: relative;
        z-index: 1;
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
        animation: logo-in 0.8s ease-out both;
      }
      .splash-logo svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 30px rgba(34,197,94,0.4));
      }

      /* Circular progress ring */
      .progress-ring {
        position: absolute;
        top: -10px;
        left: -10px;
        width: 120px;
        height: 120px;
        transform: rotate(-90deg);
      }
      .progress-ring circle {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
      }
      .progress-ring .ring-bg {
        stroke: rgba(34,197,94,0.1);
      }
      .progress-ring .ring-fg {
        stroke: #22c55e;
        stroke-dasharray: 345;
        stroke-dashoffset: 345;
        transition: stroke-dashoffset 0.6s ease;
        filter: drop-shadow(0 0 6px rgba(34,197,94,0.6));
      }

      @keyframes logo-in {
        from { opacity: 0; transform: scale(0.7) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      /* Title text */
      .splash-title {
        position: relative;
        z-index: 1;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #f0fdf4;
        text-shadow: 0 0 40px rgba(34,197,94,0.3);
        animation: text-in 0.8s 0.2s ease-out both;
      }

      /* Subtitle / status text */
      .splash-status {
        position: relative;
        z-index: 1;
        font-size: 13px;
        color: #6b8a7e;
        margin-top: 8px;
        min-height: 20px;
        transition: opacity 0.3s;
        animation: text-in 0.8s 0.4s ease-out both;
      }

      @keyframes text-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Linear progress bar at bottom */
      .splash-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(34,197,94,0.08);
      }
      .splash-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #16a34a, #4ade80);
        border-radius: 0 2px 2px 0;
        transition: width 0.5s ease;
        box-shadow: 0 0 12px rgba(34,197,94,0.5);
      }

      /* Version label */
      .splash-version {
        position: absolute;
        bottom: 14px;
        right: 18px;
        font-size: 11px;
        color: #3f5a4e;
        z-index: 1;
        animation: text-in 0.8s 0.6s ease-out both;
      }

      /* Spinner dots */
      .splash-dots {
        display: flex;
        gap: 6px;
        margin-top: 16px;
        position: relative;
        z-index: 1;
        animation: text-in 0.8s 0.5s ease-out both;
      }
      .splash-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #22c55e;
        opacity: 0.3;
        animation: dot-pulse 1.4s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot-pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
        40% { opacity: 1; transform: scale(1.3); }
      }

      /* --- React mount target --- */
      #react-root {
        height: 100%;
        width: 100%;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #react-root.mounted {
        opacity: 1;
      }

      /* --- Fallback while React loads (hidden once React mounts) --- */
      #boot-fallback {
        height: 100%;
        display: none;
      }

      /* --- Fatal error overlay --- */
      #fatal-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0a0e0d;
        color: #e8f0ec;
        padding: 32px;
        overflow: auto;
        font-family: Consolas, monospace;
        font-size: 14px;
      }
      #fatal-overlay h1 { color: #f87171; font-size: 20px; }
      #fatal-overlay pre {
        background: #131a18;
        border: 1px solid #3f3f46;
        border-radius: 8px;
        padding: 16px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <!-- ============================================
         SPLASH SCREEN (renders instantly, no flash)
         ============================================ -->
    <div id="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 100 100" fill="none">
          <!-- Outer ring -->
          <circle cx="50" cy="50" r="46" stroke="rgba(34,197,94,0.15)" stroke-width="2"/>
          <!-- Inner diamond / Minecraft-ish block -->
          <path d="M50 18 L78 36 L78 64 L50 82 L22 64 L22 36 Z" stroke="#22c55e" stroke-width="2.5" fill="none"/>
          <path d="M22 36 L50 54 L78 36" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.5"/>
          <path d="M50 54 L50 82" stroke="#22c55e" stroke-width="2" opacity="0.5"/>
          <!-- Center lightning bolt -->
          <path d="M46 38 L40 55 L48 55 L44 68 L60 48 L52 48 L56 38 Z" fill="#22c55e" opacity="0.9"/>
        </svg>
        <!-- Circular progress ring around logo -->
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="55"/>
          <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="55"/>
        </svg>
      </div>

      <div class="splash-title">RagsMC Launcher</div>
      <div class="splash-status" id="splash-status">Iniciando...</div>

      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>

      <div class="splash-version">v1.0.0</div>

      <div class="splash-progress">
        <div class="splash-progress-bar" id="splash-bar"></div>
      </div>
    </div>

    <!-- React mounts here (hidden until splash finishes) -->
    <div id="root">
      <div id="react-root"></div>
      <div id="boot-fallback"></div>
    </div>

    <script>
      // ============================================
      // SPLASH SCREEN CONTROLLER
      // Runs BEFORE React, controls splash progress
      // ============================================
      (function() {
        const splash = document.getElementById("splash");
        const bar = document.getElementById("splash-bar");
        const ring = document.getElementById("ring-fg");
        const status = document.getElementById("splash-status");
        const CIRCUMFERENCE = 2 * Math.PI * 55; // ring radius = 55

        let progress = 0;

        function setProgress(pct, text) {
          progress = Math.min(100, Math.max(progress, pct));
          bar.style.width = progress + "%";
          const offset = CIRCUMFERENCE - (progress / 100) * CIRCUMFERENCE;
          ring.style.strokeDashoffset = offset;
          if (text) status.textContent = text;
        }

        // Simulated loading sequence (realistic timing)
        const steps = [
          { pct: 10, text: "Cargando recursos...", delay: 200 },
          { pct: 25, text: "Verificando instalacion...", delay: 400 },
          { pct: 40, text: "Conectando con Mojang...", delay: 500 },
          { pct: 55, text: "Cargando versiones de Minecraft...", delay: 400 },
          { pct: 70, text: "Detectando Java...", delay: 300 },
          { pct: 85, text: "Cargando configuraciones...", delay: 350 },
          { pct: 95, text: "Preparando interfaz...", delay: 300 },
          { pct: 100, text: "Listo!", delay: 200 },
        ];

        let i = 0;
        function runStep() {
          if (i >= steps.length) return;
          const s = steps[i++];
          setProgress(s.pct, s.text);
          setTimeout(runStep, s.delay);
        }
        setTimeout(runStep, 150);

        // Expose hideSplash globally for React to call
        window.hideSplash = function() {
          setProgress(100, "Listo!");
          setTimeout(() => {
            splash.classList.add("fade-out");
            const reactRoot = document.getElementById("react-root");
            if (reactRoot) reactRoot.classList.add("mounted");
            setTimeout(() => { splash.style.display = "none"; }, 600);
          }, 300);
        };

        // Expose setSplashProgress for React to update real progress
        window.setSplashProgress = function(pct, text) {
          setProgress(pct, text);
        };
      })();
    </script>

    <!-- React entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
